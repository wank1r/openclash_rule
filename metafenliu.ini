
[custom]
; ==========================================================
; OpenClash 自定义订阅转换模板
; 新增：主备故障切换
;
; 优先级：
; 1. Singapore 04
; 2. SG 自动测速组
; 3. US 自动测速组
; 4. HK 自动测速组
; 5. 全部节点自动选择
;
; 主节点恢复后自动优先使用主节点
; 保留原有应用分流、国家测速和冷门节点策略
; ==========================================================

enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 节点清洗
; ==========================================================
exclude=流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Expire|Official|Website

; ==========================================================
; 1) 规则（自上而下优先级）
; ==========================================================
; Adobe 需要屏蔽国内可访问域名时，
; 还需在 OpenClash 的绕过指定区域 IPv4 黑名单加入：
; adobe.com
; adobelogin.com
; adobe.io
; behance.net

ruleset=🌐 Default,clash-classic:https://raw.githubusercontent.com/wank1r/openclash_rule/refs/heads/main/WWJ_PROXY.yaml,28800
ruleset=DIRECT,clash-classic:https://raw.githubusercontent.com/wank1r/openclash_rule/refs/heads/main/WWJ_DIRECT.yaml,28800
ruleset=🌐 Default,[]GEOSITE,docker
ruleset=🌐 Default,[]GEOSITE,category-porn
ruleset=REJECT,[]GEOSITE,category-ads-all

; --- 私网直连 ---
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve

; --- Aethersailor 直连补丁 ---
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800

; --- Aethersailor 代理补丁 ---
ruleset=🌐 Default,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,28800
ruleset=🌐 Default,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800

; --- 国内直连 ---
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve

; --- 国内可用 / 下载 / BT ---
ruleset=DIRECT,[]GEOSITE,google-cn
ruleset=DIRECT,[]GEOSITE,category-games@cn
ruleset=DIRECT,[]GEOSITE,category-game-platforms-download
ruleset=DIRECT,[]GEOSITE,category-public-tracker

; ==========================================================
; 核心应用
; ==========================================================

ruleset=💡 Gemini,[]GEOSITE,google-gemini
ruleset=💡 Gemini,[]GEOIP,google-gemini,no-resolve

ruleset=🤖 ChatGPT,[]GEOSITE,openai

ruleset=🍎 Apple,[]GEOSITE,apple
ruleset=🌐 Default,[]GEOSITE,youtube

; --- 开发 / 工具 ---
ruleset=🌐 Default,[]GEOSITE,github
ruleset=🌐 Default,[]GEOIP,github,no-resolve
ruleset=🚝 测速工具,[]GEOSITE,category-speedtest
ruleset=🎮 Steam,[]GEOSITE,steam

; --- Google / Microsoft / Cloudflare ---
ruleset=🌐 Default,[]GEOSITE,cloudflare
ruleset=🌐 Default,[]GEOIP,cloudflare,no-resolve

ruleset=🌐 Default,[]GEOSITE,google
ruleset=🌐 Default,[]GEOIP,google,no-resolve

ruleset=🪟 Microsoft,[]GEOSITE,microsoft
ruleset=🪟 Microsoft,[]GEOIP,microsoft,no-resolve

; --- GFW 兜底 ---
ruleset=🌐 Default,[]GEOSITE,gfw

; --- 非标端口（可选）---
; ruleset=🔀 非标端口,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800

; --- 最终兜底 ---
ruleset=🐟 漏网之鱼,[]FINAL


; ==========================================================
; 2) 应用分流策略组
; ==========================================================
; 各应用继续通过 Default 使用自动故障切换
; 保留原有的手动选择能力

custom_proxy_group=💡 Gemini`select`[]🌐 Default`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]DIRECT`.*

custom_proxy_group=🍎 Apple`select`[]DIRECT`[]🌐 Default`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`.*

custom_proxy_group=🤖 ChatGPT`select`[]🌐 Default`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`.*

custom_proxy_group=🚝 测速工具`select`[]🌐 Default`[]DIRECT`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`.*

custom_proxy_group=🎮 Steam`select`[]🌐 Default`[]DIRECT`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`.*

custom_proxy_group=🪟 Microsoft`select`[]DIRECT`[]🌐 Default`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`.*


; ==========================================================
; 3) 新增：主备故障切换（核心）
; ==========================================================
; 说明：
; fallback 按列表顺序选择可用节点或策略组
; Singapore 04 恢复后重新优先使用
; 检测间隔：60 秒
; 检测超时：5 秒
;
; 后四项为嵌套策略组，需注意 Mihomo 嵌套健康检查
; 存在已报告的异常，不保证所有故障场景可靠切换
;
; 修改优先级时，只需要修改下面这一行的成员顺序
; ==========================================================


custom_proxy_group=🎯 首选节点`url-test`(?i)^.*Singapore 04$`https://www.gstatic.com/generate_204`60,5
custom_proxy_group=🔁 主备故障切换`fallback`[]🎯 首选节点`[]🇸🇬 SG`[]🇺🇸 US`[]🇭🇰 HK`[]♻️ 自动选择`https://www.gstatic.com/generate_204`60,5
  

; ==========================================================
; 4) Default / 漏网之鱼
; ==========================================================
; 把主备故障切换放在 Default 的第一项
; 其余国家组及手动选择功能保留

custom_proxy_group=🌐 Default`select`[]🔁 主备故障切换`[]🇺🇸 US`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🧊 冷门节点`[]♻️ 自动选择`[]DIRECT`.*

custom_proxy_group=🐟 漏网之鱼`select`[]🌐 Default`[]DIRECT`[]♻️ 自动选择`[]🧊 冷门节点


; ==========================================================
; 5) 非标端口
; ==========================================================

; custom_proxy_group=🔀 非标端口`select`[]🐟 遵循规则`[]DIRECT

custom_proxy_group=🐟 遵循规则`select`[]🐟 漏网之鱼


; ==========================================================
; 6) 国家节点测速组（保留原配置）
; ==========================================================
; 全节点自动选择

custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,,50

; 香港
custom_proxy_group=🇭🇰 HK`url-test`(?i)(🇭🇰|香港|\\bHK\\b|hongkong)`http://www.gstatic.com/generate_204`300,,50

; 台湾
custom_proxy_group=🇹🇼 TW`url-test`(?i)(🇹🇼|台湾|\\bTW\\b|taiwan|taipei|hinet)`http://www.gstatic.com/generate_204`300,,50

; 日本
custom_proxy_group=🇯🇵 JP`url-test`(?i)(🇯🇵|日本|\\bJP\\b|tokyo|osaka)`http://www.gstatic.com/generate_204`300,,50

; 新加坡
custom_proxy_group=🇸🇬 SG`url-test`(?i)(🇸🇬|新加坡|\\bSG\\b|singapore)`http://www.gstatic.com/generate_204`300,,50

; 美国
custom_proxy_group=🇺🇸 US`url-test`(?i)(🇺🇸|美国|\\bUS\\b|united states|los angeles|san jose|seattle|new york)`http://www.gstatic.com/generate_204`300,,50


; ==========================================================
; 7) 冷门节点池
; ==========================================================
; 排除 HK / JP / TW / US / SG
; 剩余节点可手动选择

custom_proxy_group=🧊 冷门节点`select`(?i)^(?!.*(🇭🇰|香港|\\bHK\\b|hong\\s*kong|🇯🇵|日本|\\bJP\\b|tokyo|osaka|🇹🇼|台湾|\\bTW\\b|taiwan|taipei|hinet|🇸🇬|新加坡|\\bSG\\b|singapore|🇺🇸|美国|\\bUS\\b|united\\s*states|los\\s*angeles|san\\s*jose|seattle|new\\s*york)).*
